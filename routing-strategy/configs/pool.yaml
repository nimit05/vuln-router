# The model pool under study. Pool composition is itself a routing decision
# (strategy doc, "Pool selection"), so this file is a variable, not a constant.
#
# Requirements this pool must satisfy (problem doc §1.3):
#   1. spans ~2 orders of magnitude of compute
#   2. contains a same-size / different-family pair, so family and scale effects
#      are separable
#   3. errors are complementary -- checked by gate G1 before any router is built

engine:
  name: vllm
  version: "0.27.1"          # part of the experimental configuration (protocol §6)
  dtype: bfloat16
  temperature: 0.0
hardware: A100-PCIE-40GB

models:
  - id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    short: qwen-1.5b
    params_b: 1.5
    family: qwen
  - id: meta-llama/Llama-3.2-3B-Instruct
    short: llama-3b
    params_b: 3.0
    family: llama
  - id: microsoft/Phi-4-mini-instruct
    short: phi-3.8b
    params_b: 3.8
    family: phi
  - id: Qwen/Qwen2.5-Coder-7B-Instruct     # same-size pair member A
    short: qwen-7b
    params_b: 7.0
    family: qwen
  - id: ibm-granite/granite-3.1-8b-instruct  # same-size pair member B
    short: granite-8b
    params_b: 8.0
    family: granite
  - id: Qwen/Qwen2.5-Coder-32B-Instruct    # ceiling; optional, expensive
    short: qwen-32b
    params_b: 32.0
    family: qwen
    optional: true

# Security loss weights. Swept, not fixed -- these are the default operating point.
loss:
  c_fn: 10.0
  c_fp: 1.0

# VD-Score false-positive rate budget (PrimeVul's metric).
vd_score_fpr_budget: 0.005
